name: Trigger Event Scraper

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: trigger_events.db
          key: trigger-events-db-${{ github.run_id }}
          restore-keys: |
            trigger-events-db-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "requests>=2.28.0" "PyYAML>=6.0"
          python3 -c "import requests; import yaml; print('Dependencies OK')"

      - name: Setup config
        run: |
          echo "Using existing config.yaml"
          ls -la config.yaml

      - name: Verify module loads
        run: |
          python3 -c "from src.main import TriggerEventMonitor; print('Module OK')"

      - name: Run scraper
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python -m src.main

      - name: Sync to Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            pip install supabase
            python3 supabase_sync.py
          else
            echo "Supabase not configured - skipping sync"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alerts-${{ github.run_number }}
          path: alerts/
          retention-days: 30
